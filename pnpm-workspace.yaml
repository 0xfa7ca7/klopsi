packages:
  - "apps/*"
  - "packages/*"
  - "packages/providers/*"

allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - "prettier@3.9.10"

overrides:
  brace-expansion@<1.1.21: ">=1.1.21 <2"
  brace-expansion@>=2.0.0 <2.1.7: ">=2.1.7 <3"
  brace-expansion@>=4.0.0 <5.0.12: ">=5.0.12 <6"
  esbuild@>=0.27.3 <0.28.1: ">=0.28.1"
  js-yaml@>=3.0.0 <3.15.2: ">=3.15.2 <4"
  js-yaml@>=4.0.0 <4.3.2: ">=4.3.2 <5"
  nanoid@<3.3.18: ">=3.3.18 <4"
  postcss@<=8.5.22: ">=8.5.23"
  source-map-js@<1.2.2: ">=1.2.2"
  uuid@<11.1.1: ">=11.1.1"
  vite@>=8.0.0 <=8.1.5: "8.3.4"
